name: Build and Deploy

on:
  push:
    # branches:
    #   - master

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'          # adjust to match your project's PHP version
          coverage: none

      - name: PHP lint (syntax check)
        run: |
          find . -name '*.php' \
            -not -path './vendor/*' \
            -not -path './node_modules/*' \
            -print0 | xargs -0 -n1 -P4 php -l

  phpcs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer, cs2pr
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-progress --prefer-dist

      - name: PHPCS (coding standards)
        run: vendor/bin/phpcs --standard=phpcs.xml.dist

  create-built-branch:
    runs-on: ubuntu-latest
    needs:
      - phpcs
      - php-lint

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Deploy build output to "<base-branch>-built" branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: ${{ github.ref_name }}-built        # target branch to push build output to
          folder: build                # local folder containing the build output
          clean: true                  # remove stale files from the built branch before deploying
          commit-message: "Deploy: ${{ github.event.head_commit.message }} (${{ github.sha }})"
