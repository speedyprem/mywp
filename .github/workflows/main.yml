name: Build and Deploy

on:
  push:
    # branches:
    #   - master        # runs php-lint + phpcs automatically on every push/merge to master

  # Manual approval gate: create-built-branch only runs when someone
  # clicks "Run workflow" on this workflow in the Actions tab, on the
  # branch they want to deploy. That manual click IS the approval —
  # this works on GitHub Free/Pro/Team for private repos, unlike
  # environment "required reviewers" (which is Enterprise-only for
  # private repos).
  workflow_dispatch: {}

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'          # adjust to match your project's PHP version
          coverage: none

      - name: PHP lint (syntax check)
        run: |
          find . -name '*.php' \
            -not -path './vendor/*' \
            -not -path './node_modules/*' \
            -print0 | xargs -0 -n1 -P4 php -l

  phpcs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-progress --prefer-dist

      - name: PHPCS (coding standards)
        run: vendor/bin/phpcs --standard=phpcs.xml.dist

  create-built-branch:
    runs-on: ubuntu-latest
    needs:
      - phpcs
      - php-lint

    # Only runs on a manual "Run workflow" click (workflow_dispatch).
    # On a normal push, this job is skipped — lint/phpcs still run,
    # but nothing gets deployed until someone triggers it by hand.
    if: github.event_name == 'workflow_dispatch'

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare code for sync (exclude .git and dependency folders)
        run: |
          mkdir -p /tmp/sync-output
          rsync -av \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='.gitignore' \
            ./ /tmp/sync-output/

      - name: Deploy build output to "<base-branch>-built" branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: ${{ github.ref_name }}-built        # target branch to push build output to
          folder: /tmp/sync-output      # synced copy of the full repo, no build step
          clean: true                  # remove stale files from the built branch before deploying
          commit-message: "Deploy: ${{ github.event_name == 'push' && github.event.head_commit.message || format('manual deploy by {0}', github.actor) }} (${{ github.sha }})"
