name: Deploy on merge to master

on:
  push:
    branches: [master]

jobs:
  php-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: PHP lint
        run: |
          find . -name '*.php' \
            -not -path './vendor/*' \
            -not -path './node_modules/*' \
            -print0 | xargs -0 -n1 -P4 php -l

  phpcs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-progress --prefer-dist

      - name: PHPCS
        run: vendor/bin/phpcs --standard=phpcs.xml.dist

  find-merged-pr:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: read

    outputs:
      is-merged-pr: ${{ steps.lookup.outputs.is-merged-pr }}

    steps:
      - name: Check whether this commit came from a merged PR to master
        uses: actions/github-script@v8
        id: lookup
        with:
          script: |
            const pullRequests = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
              }
            );
            const mergedPr = pullRequests.find(
              (pullRequest) => pullRequest.merged_at && pullRequest.base.ref === 'master'
            );
            core.setOutput('is-merged-pr', mergedPr ? 'true' : 'false');

  approve-production:
    runs-on: ubuntu-latest

    if: needs.find-merged-pr.outputs.is-merged-pr == 'true'

    needs:
      - phpcs
      - php-lint
      - find-merged-pr

    environment:
      name: production-approval

    steps:
      - name: Waiting for approval
        run: echo "Deployment approved — proceeding to create-built-branch."

  create-built-branch:
    runs-on: ubuntu-latest

    needs:
      - approve-production

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare code for sync
        run: |
          mkdir -p /tmp/sync-output

          rsync -av \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='.gitignore' \
            ./ /tmp/sync-output/

      - name: Deploy build output to built branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: ${{ github.ref_name }}-built
          folder: /tmp/sync-output
          clean: true
          commit-message: "Deploy: ${{ github.event.head_commit.message }} (${{ github.sha }})"
