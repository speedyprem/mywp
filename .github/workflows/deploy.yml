name: Deploy on merge to master

on:
  workflow_run:
    workflows: [Build Test and Lint]
    types: [completed]
    branches: [master]

jobs:
  find-merged-pr:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: read

    outputs:
      is-merged-pr: ${{ steps.lookup.outputs.is-merged-pr }}

    steps:
      - name: Check whether this commit came from a merged PR to master
        uses: actions/github-script@v8
        id: lookup
        with:
          script: |
            const pullRequests = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.payload.workflow_run.head_sha,
              }
            );
            const mergedPr = pullRequests.find(
              (pullRequest) => pullRequest.merged_at && pullRequest.base.ref === 'master'
            );
            core.setOutput('is-merged-pr', mergedPr ? 'true' : 'false');

  approve-production:
    runs-on: ubuntu-latest

    if: github.event.workflow_run.conclusion == 'success' && needs.find-merged-pr.outputs.is-merged-pr == 'true'

    needs:
      - find-merged-pr

    environment:
      name: production-approval

    steps:
      - name: Waiting for approval
        run: echo "Deployment approved — proceeding to create-built-branch."

  create-built-branch:
    runs-on: ubuntu-latest

    needs:
      - approve-production

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare code for sync
        run: |
          mkdir -p /tmp/sync-output

          rsync -av \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='.gitignore' \
            ./ /tmp/sync-output/

      - name: Deploy build output to built branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: ${{ github.event.workflow_run.head_branch }}-built
          folder: /tmp/sync-output
          clean: true
          commit-message: "Deploy: ${{ github.event.workflow_run.head_commit.message }} (${{ github.event.workflow_run.head_sha }})"
